[project]
name = "siba-dataviz"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.5",
    "marimo>=0.24.2",
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "plotly>=6.5.2",
    "requests>=2.32.3",
    "scipy>=1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siba"]

[tool.hatch.build.targets.wheel.force-include]
"src/siba/data/fixtures/events.toml" = "siba/data/fixtures/events.toml"

[project.scripts]
siba = "siba.data.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "internal: logique pure, sans I/O",
    "functional: traverse une frontière (fichiers, DuckDB, sous-processus, réseau simulé)",
    "integration: interface externe réelle",
]
