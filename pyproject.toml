[project]
name = "siba-dataviz"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.5",
    "jinja2>=3.1.6",
    "marimo>=0.24.2",
    "matplotlib>=3.10.8",
    "nbdime>=4.0.4",
    "notebook>=7.5.4",
    "pandas>=3.0.1",
    "plotly>=6.5.2",
    "requests>=2.32.3",
    "scipy>=1.15.0",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siba"]

[project.scripts]
siba-db = "siba.db.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
